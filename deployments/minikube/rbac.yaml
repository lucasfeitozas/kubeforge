apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeforge
  namespace: kubeforge-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeforge-controller-role
  namespace: kubeforge-workloads
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "persistentvolumeclaims", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubeforge.io"]
    resources: ["kubeforgecomponents", "kubeforgecomponents/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeforge-controller-binding
  namespace: kubeforge-workloads
subjects:
  - kind: ServiceAccount
    name: kubeforge
    namespace: kubeforge-workloads
roleRef:
  kind: Role
  name: kubeforge-controller-role
  apiGroup: rbac.authorization.k8s.io
