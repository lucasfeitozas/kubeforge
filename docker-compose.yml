services:
  kubeforge:
    build: .
    ports:
      - "8080:8080"
    environment:
      - KUBEFORGE_HTTP_PORT=8080
      - KUBEFORGE_DB_PATH=/data/kubeforge.db
      - KUBEFORGE_KUBECONFIG=/kubeconfig/config
    volumes:
      - kubeforge-data:/data
      - ${HOME}/.kube/config:/kubeconfig/config:ro

volumes:
  kubeforge-data:
